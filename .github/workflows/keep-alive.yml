name: Keep Render Alive

on:
  schedule:
    - cron: '*/14 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render health endpoint
        run: |
          curl -s -o /dev/null -w "Status: %{http_code}\n" https://fraud-detection-jq8x.onrender.com/api/health