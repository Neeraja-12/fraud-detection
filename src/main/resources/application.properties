server.port=9090
app.security.api-keys=demo-key-123,test-key-456

# H2 database (file-based, persists across restarts)
spring.datasource.url=jdbc:h2:file:./data/fraudd
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# H2 web console — browse the database at http://localhost:9090/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console